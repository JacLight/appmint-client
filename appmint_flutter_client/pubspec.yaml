name: appmint_flutter_client
description: >-
  Talk to an Appmint (appengine) backend from Flutter. Handles app
  authentication, staff and customer sign-in including verification
  challenges, and generic reads and writes over any datatype.
version: 0.1.2
publish_to: none
repository: https://github.com/JacLight/appmint-client

environment:
  sdk: ^3.7.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
